[package]
name = "popsicle"
description = "USB Flasher"
version = "1.3.3"
authors = [
    "Jeremy Soller <jeremy@system76.com>",
    "Michael Aaron Murphy <michael@system76.com>",
]
license = "MIT"
readme = "README.md"
edition = "2024"
rust-version = "1.93"

[lib]
name = "popsicle"
path = "src/lib.rs"

[[bin]]
name = "popsicle"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.79"
as-result = "0.2.1"
async-std = "1.12.0"
derive-new = "0.6.0"
futures = "0.3.30"
futures_codec = "0.4.1"
libc = "0.2.151"
memchr = "2.7.1"
mnt = "0.3.1"
ron = "0.8.1"
serde = { version = "1.0.194", features = ["derive"] }
srmw = "0.1.1"
thiserror = "1.0.56"
usb-disk-probe = "0.2.0"

# Command line
better-panic = "0.3.0"
fomat-macros = "0.3.2"
pbr = { git = "https://github.com/ids1024/pb", branch = "write" }

# COSMIC front end
atomic = "0.6.0"
blake2 = "0.10.6"
bytemuck = "1.14.0"
bytesize = "1.3.0"
dbus = "0.9.7"
dbus-udisks2 = { git = "https://github.com/pop-os/dbus-udisks2" }
digest = "0.10.7"
hex-view = "0.1.3"
iso9660 = { git = "https://github.com/ids1024/iso9660-rs" }
md-5 = "0.10.6"
pwd = "1.4.0"
sha2 = "0.10.8"
sha-1 = { version = "0.10.1", features = ["asm"] }
url = "2.5"

# Internationalization
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = { version = "8.2.0", features = ["debug-embed"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = [
    "dbus-config",
    "multi-window",
    "surface-message",
    "tokio",
    "wayland",
    "wgpu",
    "winit",
    "x11",
    "xdg-portal",
]
