[package]
name = "popsicle"
description = "USB Flasher"
version = "1.3.3"
authors = [
    "Jeremy Soller <jeremy@system76.com>",
    "Michael Aaron Murphy <michael@system76.com>",
]
license = "MIT"
readme = "README.md"
edition = "2024"
rust-version = "1.95.0"

[lib]
name = "popsicle"
path = "src/lib.rs"

[workspace]
members = ["cli", "ui"]

[dependencies]
anyhow = "1.0.104"
as-result = "0.2.1"
async-fs = "2"
derive-new = "0.7.0"
futures = "0.3.34"
futures_codec = "0.5.0"
libc = "0.2.191"
memchr = "2.8.3"
mnt = "0.3.1"
ron = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
srmw = "0.1.1"
thiserror = "2.0.21"
usb-disk-probe = "0.2.0"
