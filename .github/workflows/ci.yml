name: Continuous Integration

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

env:
    CARGO_TERM_COLOR: always

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout sources
              uses: actions/checkout@v6
            - name: Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  components: rustfmt
                  rustflags: ""
            - name: Format
              run: cargo fmt --all -- --check

    clippy-check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout sources
              uses: actions/checkout@v6
            - name: Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  components: clippy
                  rustflags: ""
            - name: System dependencies
              run: sudo apt-get update; sudo apt-get install pkg-config libxkbcommon-dev libwayland-dev
            - name: Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout sources
              uses: actions/checkout@v6
            - name: Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  rustflags: ""
            - name: System dependencies
              run: sudo apt-get update; sudo apt-get install pkg-config libxkbcommon-dev libwayland-dev
            - name: Test
              env:
                  RUST_BACKTRACE: full
              run: cargo test --workspace
